<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Revelys visual IVR editor</title>
  <desc id="desc">Dark interface with a node palette, a commerce IVR flow canvas, and flow properties.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#121823"/><stop offset="1" stop-color="#0d121b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#9d8aff"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#273043"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#080b12"/>
  <circle cx="330" cy="-80" r="360" fill="#171a30" opacity=".55"/>
  <rect x="0" y="0" width="1280" height="68" fill="#090d15" stroke="#232c3b"/>
  <rect x="24" y="16" width="36" height="36" rx="10" fill="#17152c" stroke="#4b3fba"/>
  <path d="M35 27h14M35 41h14M35 27v14M49 27v14M35 34h14" stroke="#aa9cff" stroke-width="2"/>
  <text x="72" y="31" fill="#eef2f8" font-family="Arial,sans-serif" font-size="15" font-weight="700">Revelys</text>
  <text x="72" y="48" fill="#8490a5" font-family="Arial,sans-serif" font-size="11">AI-assisted call flow engineering</text>
  <rect x="483" y="14" width="314" height="40" rx="10" fill="#0d111a" stroke="#232c3b"/>
  <rect x="489" y="19" width="92" height="30" rx="7" fill="#252b40"/>
  <text x="506" y="39" fill="#fff" font-family="Arial,sans-serif" font-size="12">Flow editor</text>
  <text x="615" y="39" fill="#8490a5" font-family="Arial,sans-serif" font-size="12">Simulator</text>
  <text x="701" y="39" fill="#8490a5" font-family="Arial,sans-serif" font-size="12">Metrics</text>
  <rect x="1115" y="18" width="70" height="32" rx="8" fill="#10271d" stroke="#286e50"/>
  <text x="1133" y="39" fill="#8de0b4" font-family="Arial,sans-serif" font-size="11">Access</text>

  <g filter="url(#shadow)">
    <rect x="18" y="86" width="188" height="614" rx="14" fill="url(#panel)" stroke="#232c3b"/>
    <rect x="220" y="86" width="826" height="614" rx="14" fill="url(#panel)" stroke="#232c3b"/>
    <rect x="1060" y="86" width="202" height="614" rx="14" fill="url(#panel)" stroke="#232c3b"/>
  </g>
  <text x="36" y="116" fill="#9aa5b8" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">+ NODES</text>
  <g font-family="Arial,sans-serif" font-size="12" fill="#d7ddea">
    <g transform="translate(32 133)"><rect width="160" height="43" rx="9" fill="#111722" stroke="#273043"/><text x="18" y="26">Prompt</text></g>
    <g transform="translate(32 184)"><rect width="160" height="43" rx="9" fill="#111722" stroke="#273043"/><text x="18" y="26">Collect input</text></g>
    <g transform="translate(32 235)"><rect width="160" height="43" rx="9" fill="#111722" stroke="#273043"/><text x="18" y="26">AI intent</text></g>
    <g transform="translate(32 286)"><rect width="160" height="43" rx="9" fill="#111722" stroke="#273043"/><text x="18" y="26">Decision</text></g>
    <g transform="translate(32 337)"><rect width="160" height="43" rx="9" fill="#111722" stroke="#273043"/><text x="18" y="26">Set variable</text></g>
    <g transform="translate(32 388)"><rect width="160" height="43" rx="9" fill="#18152a" stroke="#4b3f86"/><text x="18" y="26" fill="#c0b5ff">Agent queue</text></g>
    <g transform="translate(32 439)"><rect width="160" height="43" rx="9" fill="#111722" stroke="#273043"/><text x="18" y="26">End</text></g>
  </g>

  <text x="240" y="114" fill="#eef2f8" font-family="Arial,sans-serif" font-size="15" font-weight="700">Demo Commerce IVR</text>
  <text x="240" y="132" fill="#8490a5" font-family="Arial,sans-serif" font-size="10">9 nodes · 11 edges · published v1</text>
  <rect x="886" y="101" width="65" height="34" rx="8" fill="#171e2a" stroke="#273043"/><text x="900" y="122" fill="#d8dfeb" font-family="Arial,sans-serif" font-size="10">Save</text>
  <rect x="959" y="101" width="72" height="34" rx="8" fill="url(#accent)"/><text x="974" y="122" fill="#fff" font-family="Arial,sans-serif" font-size="10" font-weight="700">Publish</text>
  <rect x="221" y="150" width="824" height="549" fill="#0b1018"/>
  <rect x="221" y="150" width="824" height="549" fill="url(#dots)"/>

  <g stroke="#46516a" stroke-width="2" fill="none">
    <path d="M349 416H397"/><path d="M517 416H565"/><path d="M685 416H730"/>
    <path d="M850 416C880 416 870 290 900 290"/><path d="M850 416C880 416 870 375 900 375"/>
    <path d="M850 416C880 416 870 460 900 460"/><path d="M850 416C880 416 870 545 900 545"/>
    <path d="M1008 290C1026 290 1018 416 1035 416"/><path d="M1008 375H1035"/><path d="M1008 460H1035"/><path d="M1008 545C1026 545 1018 416 1035 416"/>
  </g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(255 397)"><rect width="94" height="38" rx="9" fill="#142119" stroke="#286e50"/><text x="13" y="23" fill="#7ad9aa" font-size="11" font-weight="700">Start</text></g>
    <g transform="translate(397 397)"><rect width="120" height="38" rx="9" fill="#151b26" stroke="#2d374a"/><text x="14" y="23" fill="#e4e9f2" font-size="11" font-weight="700">Welcome</text></g>
    <g transform="translate(565 397)"><rect width="120" height="38" rx="9" fill="#151b26" stroke="#2d374a"/><text x="14" y="23" fill="#e4e9f2" font-size="11" font-weight="700">Ask reason</text></g>
    <g transform="translate(730 397)"><rect width="120" height="38" rx="9" fill="#211c3c" stroke="#5b4cc4"/><text x="14" y="23" fill="#c1b7ff" font-size="11" font-weight="700">AI intent</text></g>
    <g transform="translate(900 271)"><rect width="108" height="38" rx="9" fill="#151b26" stroke="#2d374a"/><text x="12" y="23" fill="#e4e9f2" font-size="10">Order status</text></g>
    <g transform="translate(900 356)"><rect width="108" height="38" rx="9" fill="#151b26" stroke="#2d374a"/><text x="12" y="23" fill="#e4e9f2" font-size="10">Cancellation</text></g>
    <g transform="translate(900 441)"><rect width="108" height="38" rx="9" fill="#231b12" stroke="#8a642f"/><text x="12" y="23" fill="#efc17d" font-size="10">Agent queue</text></g>
    <g transform="translate(900 526)"><rect width="108" height="38" rx="9" fill="#151b26" stroke="#2d374a"/><text x="12" y="23" fill="#e4e9f2" font-size="10">Fallback</text></g>
    <g transform="translate(1035 397)"><rect width="82" height="38" rx="9" fill="#351a20" stroke="#7d3340"/><text x="20" y="23" fill="#ff9aaa" font-size="11" font-weight="700">End</text></g>
  </g>

  <text x="1078" y="116" fill="#9aa5b8" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">PROPERTIES</text>
  <text x="1078" y="151" fill="#6f7b90" font-family="Arial,sans-serif" font-size="11">Select a node or edge</text>
  <text x="1078" y="168" fill="#6f7b90" font-family="Arial,sans-serif" font-size="11">to edit its configuration.</text>
</svg>
